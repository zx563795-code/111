<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091414"><title>강호 입문 — 나의 문파와 무공은?</title>
<style>
:root{color-scheme:dark;--gold:#e3c58b;--dim:#a8b6ad;--ink:#f1e9d8}*{box-sizing:border-box}body{margin:0;background:#091414;color:var(--ink);font-family:"Noto Serif KR","Batang",serif}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.5}button:focus-visible,input:focus-visible{outline:2px solid #f7dda3;outline-offset:5px}#scene{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#264443,#091414 75%)}#scene canvas{display:block;width:100%;height:100%}.vignette{pointer-events:none;position:fixed;inset:0;box-shadow:inset 0 0 15vw 5vw #02080885;background:linear-gradient(#03090980,transparent 23%,transparent 70%,#030909ba)}#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:clamp(26px,6vh,64px) 20px 34px;transition:opacity .65s;z-index:2}.eyebrow{font-size:11px;letter-spacing:6px;color:var(--gold)}h1{font-size:clamp(25px,4vw,43px);font-weight:500;letter-spacing:6px;margin:14px 0;text-shadow:0 2px 15px #000}header p{font-size:12px;color:#c5d3c9;letter-spacing:2px}.entry{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:min(260px,75vw)}.primary{border:1px solid #d3b47d;background:linear-gradient(145deg,#3e3322ed,#131c19f2);color:#ffe5af;padding:17px 38px;letter-spacing:5px;box-shadow:0 0 36px #efc77a18,inset 0 0 15px #e5b76110;border-radius:3px;transition:background .2s,box-shadow .2s}.primary:hover:not(:disabled){background:#4b3c26;box-shadow:0 0 35px #eec57440}.entry .primary{width:100%;font-size:21px}.entry small{display:block;margin-top:13px;font-size:11px;letter-spacing:2px;color:#d1c5ad;text-shadow:0 2px 4px #000}.intro-foot{margin-top:auto;font-size:11px;color:#b7c1b5;letter-spacing:2px;line-height:2}#loading{color:#d9c296}#sound{position:fixed;right:16px;top:16px;z-index:10;display:flex;gap:9px;align-items:center;background:#0a151bd9;border:1px solid #bca47144;border-radius:24px;padding:8px 12px;font-size:11px}#sound button{border:0;background:none;color:var(--gold);padding:4px}#volume{width:64px;accent-color:var(--gold)}#veil{position:fixed;inset:0;pointer-events:none;background:#d7e8d8;opacity:0;z-index:3}#cinema{position:fixed;bottom:8%;left:0;right:0;text-align:center;pointer-events:none;color:#ecdfbd;letter-spacing:7px;font-size:12px;opacity:0;z-index:4;text-shadow:0 2px 12px #000}#app{position:relative;z-index:5;max-width:680px;margin:0 auto;padding:80px 20px 40px;min-height:100svh;display:flex;align-items:center}#app[hidden],#intro[hidden]{display:none}#panel{width:100%;padding:clamp(22px,5vw,40px);background:linear-gradient(140deg,#101e20f5,#102020e8);border:1px solid #c6af7845;border-radius:10px;box-shadow:0 25px 100px #0008;backdrop-filter:blur(14px);animation:appear .8s ease both}@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}.topline{display:flex;justify-content:space-between;align-items:center;color:var(--gold);font-size:12px;letter-spacing:2px}.track{height:3px;background:#73877f33;margin:17px 0 30px}.track span{display:block;height:100%;background:var(--gold);transition:width .4s}h2{font-size:clamp(19px,3vw,25px);line-height:1.8;font-weight:500;margin:0 0 28px}.choices{display:grid;gap:10px}.choice{display:flex;gap:13px;align-items:center;text-align:left;padding:16px;background:#9cbba708;border:1px solid #a9bba72c;color:#e1e8df;border-radius:5px;font-size:14px;line-height:1.7}.choice b{font:12px Georgia;color:var(--gold);border:1px solid #dac38b55;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;flex-shrink:0}.choice:hover,.choice[aria-pressed="true"]{background:#b49a5720;border-color:var(--gold)}.next{width:100%;margin-top:22px;letter-spacing:2px}.hint{font-size:11px;color:var(--dim);text-align:center;line-height:1.8;margin:18px 0 0}.result{text-align:center}.seal{border:1px solid var(--gold);width:68px;height:68px;display:grid;place-items:center;transform:rotate(45deg);margin:14px auto 32px;background:#c8aa5810}.seal span{transform:rotate(-45deg);font-size:30px;color:var(--gold)}.result h2{color:var(--gold);font-size:32px;margin:9px 0}.nickname{font-size:21px}.desc{font-size:14px;color:#c1cabe;line-height:1.9}.skill{margin:24px 0;padding:16px;border-block:1px solid #bba56b35;font-size:14px;line-height:2}.skill small{color:var(--dim);font-size:10px;letter-spacing:4px}.abilities{text-align:left;margin:25px 0}.ability{display:grid;grid-template-columns:50px 1fr 66px;gap:12px;align-items:center;margin:17px 0;font-size:12px}.bar{height:6px;background:#bdd0bf15}.bar span{display:block;height:100%;background:linear-gradient(90deg,#507c74,#dbbf83);animation:fill 1.2s ease both;transform-origin:left}@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}.relations{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}.relations div{padding:16px;border:1px solid #b8ad7c30;border-radius:4px}.relations small{color:var(--dim);font-size:11px}.relations b{display:block;margin-top:8px;font-size:14px;font-weight:500;color:var(--gold)}.relations p{font-size:12px;line-height:1.8;color:#bbc7bd;margin-bottom:0}.secondary{background:none;color:#c2cfc6;border:0;margin:20px auto 0;padding:10px;display:block;font-size:12px}#error{max-width:440px;letter-spacing:0;line-height:1.8;margin:auto;color:#eed6ad;font-size:12px}.playing #intro{opacity:0;pointer-events:none}.testing .vignette{background:#04101255}.noscript{position:fixed;inset:30% 10%;z-index:20;background:#142320;padding:30px} @media(max-width:600px){#intro{padding-top:76px}h1{letter-spacing:3px}#sound{top:10px;right:10px}.intro-foot{font-size:10px}#app{padding:70px 14px 24px}.choice{padding:13px;font-size:13px}.relations{grid-template-columns:1fr 1fr}.relations div{padding:12px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* 결과 공개 시네마틱 — 고딕풍 3D 게임 공간, 시작 화면은 변경하지 않음 */
#reveal{--reveal-color:#bda06b;--reveal-deep:#201b28;position:fixed;inset:0;z-index:30;isolation:isolate;display:grid;place-items:center;pointer-events:none;opacity:0;overflow:hidden;background:radial-gradient(ellipse at 50% 52%,var(--reveal-deep),#06070d 72%);transition:opacity .45s}
#reveal.active{opacity:1;pointer-events:auto}#reveal:before{content:"";position:absolute;inset:-30%;background:repeating-radial-gradient(ellipse at 50% 54%,transparent 0 5vw,#0006 5.2vw 5.6vw),radial-gradient(circle at 50% 50%,var(--reveal-color),transparent 33%);mix-blend-mode:screen;opacity:0;filter:blur(18px);transform:scale(.25)}#reveal.active:before{animation:rift 5.8s cubic-bezier(.12,.7,.2,1) forwards}
.reveal-dust{position:absolute;inset:-15%;background-image:radial-gradient(circle,#f8e8b8 0 1px,transparent 1.6px),radial-gradient(circle,var(--reveal-color) 0 1px,transparent 2px);background-size:47px 59px,83px 71px;opacity:0;mix-blend-mode:screen}.active .reveal-dust{animation:warpDust 5.8s cubic-bezier(.1,.7,.3,1) forwards}
.reveal-hall{position:absolute;inset:-14vh -20vw;opacity:0;transform:perspective(950px) translateZ(-1100px) rotateX(8deg);transform-style:preserve-3d;background:linear-gradient(90deg,#05060ac8 0 8%,transparent 8.5% 91.5%,#05060ac8 92%),linear-gradient(180deg,#05060a 0%,transparent 26%,#07080f 88%)}
.reveal-hall:before{content:"";position:absolute;inset:10vh 9vw 0;background:repeating-linear-gradient(90deg,transparent 0 11%,color-mix(in srgb,var(--reveal-color),transparent 73%) 11.3% 12.3%,transparent 12.6% 25%),linear-gradient(90deg,#0009,transparent 28% 72%,#0009),linear-gradient(180deg,#191a27,#06070d 76%);clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);box-shadow:inset 0 0 9vw #000,0 0 120px var(--reveal-color)}
.reveal-hall:after{content:"";position:absolute;left:50%;bottom:-8vh;width:84vw;height:72vh;transform:translateX(-50%) rotateX(67deg);transform-origin:bottom;background:linear-gradient(90deg,transparent 0 48.5%,color-mix(in srgb,var(--reveal-color),transparent 45%) 49% 51%,transparent 51%),repeating-linear-gradient(90deg,transparent 0 8%,#05060d 8.4% 9.1%,transparent 9.5% 16%),repeating-linear-gradient(0deg,#05060d 0 8%,transparent 8.5% 16%);box-shadow:0 0 50px #000 inset}.active .reveal-hall{animation:hallFly 5.8s cubic-bezier(.12,.72,.18,1) forwards}
.reveal-architecture{position:absolute;inset:0;z-index:1;opacity:0;background:linear-gradient(90deg,transparent 0 5%,#05060eee 5.2% 14%,transparent 14.4% 85.6%,#05060eee 86% 94.8%,transparent 95%),repeating-linear-gradient(90deg,transparent 0 16%,color-mix(in srgb,var(--reveal-color),transparent 52%) 16.4% 17.2%,transparent 17.8% 33%);filter:drop-shadow(0 0 18px var(--reveal-color))}.active .reveal-architecture{animation:archIn 4s .7s forwards}
.reveal-emblem{position:relative;z-index:3;width:clamp(130px,27vw,260px);aspect-ratio:1;display:grid;place-items:center;opacity:0;transform:perspective(700px) translateZ(-500px) rotateY(-22deg) scale(.25);filter:drop-shadow(0 0 28px var(--reveal-color))}.reveal-emblem:before,.reveal-emblem:after{content:"";position:absolute;inset:4%;border:1px solid color-mix(in srgb,var(--reveal-color),#fff 34%);transform:rotate(45deg);box-shadow:0 0 22px var(--reveal-color),inset 0 0 25px color-mix(in srgb,var(--reveal-color),transparent 55%)}.reveal-emblem:after{inset:18%;border-style:dashed;animation:spin 11s linear infinite}.reveal-symbol{position:relative;z-index:2;font-size:clamp(70px,15vw,142px);color:#fff7d4;text-shadow:0 0 8px #fff,0 0 32px var(--reveal-color);font-family:serif;line-height:1}.reveal-symbol small{display:none}#reveal.show-symbol .reveal-emblem{animation:emblemIn 1.4s cubic-bezier(.12,.85,.15,1) forwards}
.reveal-name{position:absolute;z-index:4;bottom:13%;color:#fff3d4;font-size:clamp(27px,7vw,66px);font-weight:500;letter-spacing:.45em;text-indent:.45em;opacity:0;transform:translateY(30px) scale(.95);text-shadow:0 3px 3px #000,0 0 28px var(--reveal-color)}#reveal.show-name .reveal-name{animation:nameIn 1s cubic-bezier(.15,.8,.22,1) forwards}
@keyframes rift{0%{opacity:0;transform:scale(.2)}20%{opacity:.2}72%{opacity:.8;transform:scale(1.8)}100%{opacity:.15;transform:scale(3)}}@keyframes warpDust{0%{opacity:0;transform:scale(2.4)}18%{opacity:.7}73%{opacity:.6;transform:scale(.33)}100%{opacity:0;transform:scale(.08)}}@keyframes hallFly{0%{opacity:0;transform:perspective(950px) translateZ(-1100px) rotateX(8deg)}16%{opacity:1}75%{opacity:1;transform:perspective(950px) translateZ(-10px) rotateX(1deg)}100%{opacity:1;transform:perspective(950px) translateZ(140px)}}@keyframes archIn{to{opacity:.82}}@keyframes emblemIn{0%{opacity:0;transform:perspective(700px) translateZ(-500px) rotateY(-22deg) scale(.25)}62%{opacity:1;transform:perspective(700px) translateZ(30px) rotateY(4deg) scale(1.12)}100%{opacity:1;transform:perspective(700px) translateZ(0) rotateY(0) scale(1)}}@keyframes nameIn{to{opacity:1;transform:translateY(0) scale(1)}}@keyframes spin{to{transform:rotate(405deg)}}
@media(prefers-reduced-motion:reduce){#reveal.active:before,.active .reveal-dust,.active .reveal-hall,.active .reveal-architecture,#reveal.show-symbol .reveal-emblem,#reveal.show-name .reveal-name{animation:none;opacity:1;transform:none}}
</style></head><body>
<div id="scene" aria-hidden="true"></div><div class="vignette"></div><div id="veil"></div><div id="reveal" aria-live="polite"><div class="reveal-dust"></div><div class="reveal-hall"></div><div class="reveal-architecture"></div><div class="reveal-emblem"><div class="reveal-symbol" id="revealGlyph">✦</div></div><div class="reveal-name" id="revealName"></div></div>

<section id="intro"><header><div class="eyebrow">BEYOND THE GATE</div><h1>강호 입문 테스트</h1><p>당신의 문파와 무공은?</p></header><div class="entry"><button id="enter" class="primary" disabled>정문 준비 중</button><small>문 너머, 당신의 강호가 시작된다</small></div><footer class="intro-foot"><div id="loading" role="status">산문을 불러오는 중…</div><div id="error" role="alert"></div><div>네 번의 선택의 장 · 열여섯 번의 갈림길</div><div>예상 소요 시간 약 3분 · 소리와 함께 감상하세요</div></footer></section>

<script>

 const mistMap=mistTexture(),mists=[];for(let i=0;i<32;i++){const front=i<18;const mat=new THREE.SpriteMaterial({map:mistMap,color:front?0xbed8cd:0xc0ffe3,transparent:true,opacity:front?.3:.03,depthWrite:false});const sprite=new THREE.Sprite(mat);const baseX=(i%7-3)*3.1,baseZ=front?3+(i%6)*4:-4-(i%5)*4;sprite.position.set(baseX,.8+(i%4)*.6,baseZ);sprite.scale.set(13,4.5,1);scene.add(sprite);mists.push({sprite,baseX,baseZ,front,offset:i*1.7});}

 // 구간별 속도 연속성을 유지하는 cubic Hermite dolly. 경첩이 충분히 열린 뒤 문턱 통과.
 function hermite(t,p0,p1,v0,v1,d){const u=clamp(t/d),u2=u*u,u3=u2*u;return (2*u3-3*u2+1)*p0+(u3-2*u2+u)*v0*d+(-2*u3+3*u2)*p1+(u3-u2)*v1*d;}
 function cameraZ(t){const speed=-2;if(t<2.5)return hermite(t,startZ,9,0,speed,2.5);if(t<4.5)return hermite(t-2.5,9,4.8,speed,-2,2);return hermite(t-4.5,4.8,-12,-2,-5,2.7);}
